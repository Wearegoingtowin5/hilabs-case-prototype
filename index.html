<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedCare Provider Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2a6af1;--blue-d:#1f55c8;--navy:#072669;--navy-d:#051a47;--ink:#29303d;--muted:#465167;--bg:#f4f7fd;--card:#fff;--bd:#cfdcf8;--bd2:#e3eaf8;--green:#4f8a10;--greenL:#e9f5d6;--yellow:#946a00;--yellowL:#fff3cc;--orange:#b85a00;--orangeL:#ffe9d2;--red:#c42d2d;--redL:#fde4e4;--purple:#6a3dd0;--blueL:#e6eefe;--grey:#6b7587}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14.5px/1.5 "Plus Jakarta Sans",Satoshi,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0;color:var(--navy);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.6rem}h3{font-size:1.02rem}
button,input,select{font:inherit}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:1.65rem;letter-spacing:-.02em;padding:2px 10px 0}
.brand b{color:#5b8cff}.brand sup{font-size:.45em;font-weight:600;opacity:.8}
.prod{padding:0 10px 14px;font-size:.78rem;color:#b9c7ee;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#cfdaf7;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:.92rem}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-selected="true"]{background:var(--blue);color:#fff}
.nav .num{margin-left:auto;background:#fff;color:var(--navy);border-radius:999px;font-size:.72rem;padding:0 7px;font-weight:800}
.sidefoot{margin-top:auto;font-size:.72rem;color:#9fb1e2;padding:8px 10px}
.mainwrap{flex:1;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border-bottom:1px solid var(--bd2);padding:10px 24px;position:sticky;top:0;z-index:5}
.crumb{font-weight:700;color:var(--navy);flex:1 1 220px}
.crumb span{color:var(--muted);font-weight:500}
.search{flex:0 1 280px;position:relative}
.search input{width:100%;border:1.5px solid var(--bd);border-radius:999px;padding:8px 14px 8px 36px;background:var(--bg)}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--grey)}
.sim{background:linear-gradient(90deg,#29b2e6,#5d3fd3);color:#fff;font-weight:800;font-size:.72rem;padding:5px 11px;border-radius:999px;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blueL);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.8rem}
main{padding:22px 24px 8px;max-width:1280px;outline:none}
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:800;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}
.eyebrow svg{width:14px;height:14px}
.phead{margin-bottom:14px}
.phead p{margin:4px 0 0;color:var(--muted);max-width:760px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(7,38,105,.05)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--blueL)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(90deg,#29b2e6,#5d3fd3)}
.btn.primary:hover{filter:brightness(.93)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--redL)}
.btn.sm{padding:5px 12px;font-size:.86rem;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-block;border:1.5px solid;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:700;white-space:nowrap}
.b-auto{background:var(--greenL);color:var(--green);border-color:#a8d26a}
.b-outreach{background:var(--blueL);color:var(--blue-d);border-color:#9bb8f8}
.b-human{background:var(--yellowL);color:var(--yellow);border-color:#f0c64d}
.b-ready{background:var(--greenL);color:var(--green);border-color:#a8d26a}
.b-done{background:#eef1f6;color:var(--grey);border-color:#c9d0dc}
.b-bad{background:var(--redL);color:var(--red);border-color:#f0a1a1}
.b-sim{background:#efe9fd;color:var(--purple);border-color:#c8b8f3}
.tw{border:1.5px solid var(--bd);border-radius:14px;overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;vertical-align:top;font-size:.9rem;border-bottom:1px solid var(--bd2)}
th{background:#eef3fd;color:var(--navy);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8faff}
td.num,th.num{text-align:right}
.diff{background:var(--yellowL)}
.kpi{background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(7,38,105,.05)}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:600}
.kpi .v{font-size:2rem;font-weight:800;color:var(--blue);line-height:1.15}
.kpi .d{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:0 8px;margin-top:2px}
.d-up{background:var(--greenL);color:var(--green)}.d-flat{background:#eef1f6;color:var(--grey)}.d-bad{background:var(--redL);color:var(--red)}
.bar2{height:10px;background:#e3eaf8;border-radius:5px;margin:4px 0}
.bar2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#29b2e6,#2a6af1)}
.bar2 i.base{background:#aab6cf}
.banner{border:1.5px solid;border-radius:12px;padding:9px 12px;margin:10px 0;font-size:.9rem}
.ban-err{background:var(--redL);border-color:#f0a1a1}.ban-ok{background:var(--greenL);border-color:#a8d26a}.ban-warn{background:var(--yellowL);border-color:#f0c64d}.ban-info{background:var(--blueL);border-color:#9bb8f8}
.alertchip{display:inline-flex;align-items:center;gap:6px;background:var(--redL);color:var(--red);border-radius:8px;padding:2px 9px;font-weight:700;font-size:.78rem}
.steps{margin:6px 0 0;padding-left:20px}
.spinner{display:inline-block;width:14px;height:14px;border:3px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.pillstat{display:inline-flex;align-items:center;align-self:center;gap:10px;background:#fff;border:2px solid var(--blue);border-radius:999px;padding:6px 20px 6px 8px;box-shadow:0 6px 16px rgba(42,106,241,.14)}
.pillstat .ic{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.pillstat .ic svg{width:18px;height:18px}
.pillstat .t{font-size:.74rem;color:var(--ink);font-weight:600;line-height:1.1}
.pillstat .v{font-weight:800;color:var(--green);font-size:1.15rem;line-height:1.1}
.donutwrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;border:2px solid var(--blue);border-radius:28px;padding:14px 20px;background:#fff;box-shadow:0 8px 22px rgba(42,106,241,.12)}
.legend{display:grid;gap:5px;font-size:.84rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;background:#eef1f8;border-radius:5px;padding:0 6px;font-size:.74rem}
.legend span{min-width:150px}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:#fff;border-left:2px solid var(--navy);box-shadow:-10px 0 28px rgba(7,38,105,.25);overflow-y:auto;z-index:20;padding:18px}
.scrim{position:fixed;inset:0;background:rgba(7,38,105,.4);z-index:10}
fieldset{border:1.5px solid var(--bd);border-radius:12px;margin:8px 0;padding:6px 12px}
legend{font-weight:700;font-size:.86rem;padding:0 4px;color:var(--navy)}
label.opt{display:block;padding:2px 0;font-size:.9rem}
select,input[type=number],input[type=text]{border:1.5px solid var(--bd);border-radius:10px;padding:6px 10px;background:#fff}
input[type=number]{width:90px}
.r3{display:grid;gap:6px;margin:8px 0}
.r3 div{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:.84rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;max-width:92%;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
footer{padding:6px 24px 28px;color:var(--grey);font-size:.78rem;max-width:1280px}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px}
  .prod,.sidefoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .nav button{white-space:nowrap;padding:8px 12px}
  main{padding:14px 12px}.bar{padding:8px 12px}
  h2{font-size:1.3rem}.kpi .v{font-size:1.6rem}
}

/* ===== v3 visual refresh ===== */
body{background:radial-gradient(1200px 500px at 85% -10%,#e4ecff 0,transparent 60%),#f5f8fe;font-size:14.5px}
.side{width:248px;background:linear-gradient(180deg,#0a2f7e 0%,#072669 55%,#051a47 100%);padding:22px 14px;gap:4px}
.brand{font-size:1.9rem;padding:0 10px}
.prod{margin:2px 0 14px;padding:0 10px 16px}
.nav button{white-space:nowrap;padding:11px 12px;border-radius:12px;font-size:.92rem;transition:background .15s}
.nav button[aria-selected="true"]{background:linear-gradient(90deg,#2a6af1,#4a7df5);box-shadow:0 6px 16px rgba(42,106,241,.45)}
.nav .num{background:#ff6b6b;color:#fff;min-width:22px;text-align:center}
.nav button[aria-selected="true"] .num{background:#fff;color:var(--blue)}
.bar{flex-wrap:nowrap;padding:12px 28px;gap:14px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid #e3eaf8}
.crumb{flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.search{flex:0 0 170px}.search input{min-width:0}
.sim{white-space:nowrap}
.clock{white-space:nowrap;gap:8px}.clock span{font-size:.82rem}
.clock .btn{white-space:nowrap}
main{padding:26px 28px 10px;max-width:1320px}
.phead h2{font-size:1.85rem;letter-spacing:-.02em}
.phead p{font-size:.95rem}
.card{border:1px solid #dfe8fb;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(7,38,105,.06)}
.kpi{border:1px solid #dfe8fb;border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;box-shadow:0 10px 30px rgba(7,38,105,.06)}
.kpi .ico{grid-row:1/4;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#e7efff,#f1ecff);color:var(--blue);display:grid;place-items:center}
.kpi .ico svg{width:22px;height:22px}
.kpi .v{font-size:1.9rem;color:var(--navy)}
.tw{border:1px solid #dfe8fb;border-radius:18px}
th{background:#f3f7ff;font-size:.72rem;color:#5b6a8c;padding:11px 14px;border-bottom:1px solid #e3eaf8}
td{padding:12px 14px}
tbody tr{transition:background .12s}
.prov{display:flex;align-items:center;gap:11px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;flex:none}
.ring{--p:0;--c:#4f8a10;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e3eaf8 0);display:grid;place-items:center;position:relative;margin-left:auto}
.ring::before{content:"";position:absolute;inset:5px;background:#fff;border-radius:50%}
.ring b{position:relative;font-size:.8rem;color:var(--navy)}
.hero{background:linear-gradient(120deg,#072669 0%,#1a4fc4 55%,#5d3fd3 120%);color:#fff;border-radius:24px;padding:22px 26px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;margin-bottom:16px;box-shadow:0 18px 40px rgba(7,38,105,.28);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h3{color:#fff;font-size:1.1rem}.hero .sub{color:#c8d7fb;font-size:.84rem}
.bigring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(#7be0a5 calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;position:relative}
.bigring::before{content:"";position:absolute;inset:10px;background:#0c3290;border-radius:50%}
.bigring b{position:relative;font-size:1.7rem;font-weight:800}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.18);margin:10px 0 8px}
.stack i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:#dbe6ff}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg em{width:9px;height:9px;border-radius:50%;display:inline-block}
.hstats{display:grid;gap:8px}
.hstat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 14px;min-width:150px}
.hstat b{display:block;font-size:1.35rem;line-height:1.1}.hstat span{font-size:.74rem;color:#c8d7fb}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.tile{border-radius:16px;padding:14px;color:#fff;min-height:88px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:1.5rem}.tile span{font-size:.78rem;opacity:.95}
.btn{transition:transform .1s,box-shadow .15s}
.btn.primary{box-shadow:0 6px 16px rgba(93,63,211,.3)}.btn.primary:hover{transform:translateY(-1px)}
.btn.sm.on{box-shadow:0 4px 12px rgba(7,38,105,.25)}
aside.drawer{border-left:0;border-radius:24px 0 0 24px;padding:24px}
@media (max-width:1100px){.search{display:none}.hero{grid-template-columns:auto 1fr}.hstats{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
@media (max-width:860px){.side{padding:10px 12px}.nav button{padding:8px 12px}.bar{flex-wrap:wrap;padding:8px 12px}.hero{grid-template-columns:1fr;padding:18px}main{padding:16px 12px}.crumb{flex:1 1 100%;white-space:normal}.clock{flex-wrap:wrap;white-space:normal}.clock .btn{white-space:normal}}

.hero.slim{padding:12px 20px;gap:18px;margin-bottom:12px;border-radius:18px}.hero.slim .bigring{width:64px;height:64px}.hero.slim .bigring::before{inset:7px}.hero.slim .bigring b{font-size:1.05rem}.hero.slim .sub{display:none}.hero.slim .stack{margin:6px 0}.hero.slim .hstats{grid-template-columns:repeat(2,auto)}.hero.slim .hstat{padding:6px 12px;min-width:0}.hero.slim .hstat b{font-size:1.05rem}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;margin-top:10px}
.inbox{border:1px solid #dfe8fb;border-radius:18px;background:#fff;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:76px}
.inhead{padding:10px 14px;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5b6a8c;background:#f3f7ff;border-bottom:1px solid #e3eaf8;position:sticky;top:0;z-index:1}
.irow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #eef2fb;padding:11px 12px;cursor:pointer;border-left:4px solid transparent}
.irow:hover{background:#f6f9ff}.irow.sel{background:#eaf1ff;border-left-color:var(--blue)}
.irow .it{display:grid;gap:2px;min-width:0;flex:1}.irow .it b{color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .ring{width:38px;height:38px;flex:none}.irow .ring::before{inset:4px}.irow .ring b{font-size:.72rem}.irow .av{width:34px;height:34px}
.ws{background:#fff;border:1px solid #dfe8fb;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(7,38,105,.06);min-width:0}
.ws h3{margin-top:14px}
@media (max-width:980px){.split{grid-template-columns:1fr}.inbox{position:static;max-height:260px}}

.chk{list-style:none;margin:6px 0;padding:0;display:grid;gap:8px}.chk li{border:1px solid #e3eaf8;border-radius:12px;padding:8px 12px;background:#fbfcff}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{background:#eef3fd;border-radius:16px;padding:10px;min-height:200px}.bh{font-weight:800;color:var(--navy);font-size:.82rem;padding:2px 4px 8px;display:flex;justify-content:space-between}
.bcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dfe8fb;border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 4px 10px rgba(7,38,105,.05)}.bcard:hover{border-color:var(--blue)}
#costsim,#rules{margin:8px 0}

.toast{display:flex;align-items:center;gap:12px}.toast .tundo{background:#fff;color:var(--navy);border:0;border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer}.toast .tundo:focus-visible{outline:3px solid #ffcf5c}
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 12px}.status h2{font-size:1.15rem;margin:0}.status .prog{flex:1 1 220px;min-width:180px}.status .pbar{height:8px;border-radius:99px;background:#dfe6f5;overflow:hidden}.status .pbar i{display:block;height:100%;background:linear-gradient(90deg,#2a6af1,#5d3fd3);border-radius:99px;transition:width .35s}.status .plabel{font-size:.8rem;color:var(--muted,#5b6785);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{font-size:.8rem;padding:3px 10px;border-radius:99px;background:#eef2fb;color:#1a2a55}.chips b{margin-left:4px}
details.tools{margin:0 0 10px;border:1px dashed #c8d3ee;border-radius:12px;padding:6px 12px}details.tools>summary{cursor:pointer;font-weight:600;color:#33436f}
.pal{position:fixed;inset:0;background:rgba(7,20,60,.45);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal .box{background:#fff;width:min(560px,92vw);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}.pal input{width:100%;border:0;border-bottom:1px solid #e2e8f6;padding:16px 18px;font-size:1.05rem;outline:none;box-sizing:border-box}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}.pal li button{width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:9px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.pal li button.on,.pal li button:hover{background:#eaf0ff}.pal small{color:#6a7799}
.kbd{font:600 .72rem/1 ui-monospace,monospace;border:1px solid #c8d3ee;border-radius:6px;padding:2px 6px;color:#51608a}

.card{border-color:transparent!important;box-shadow:0 1px 2px rgba(7,38,105,.05),0 10px 30px rgba(7,38,105,.07)!important;border-radius:18px!important}
.btn.primary{box-shadow:0 6px 16px rgba(42,106,241,.28)}
.ai{border-radius:16px;padding:14px 16px;margin:0 0 14px;background:linear-gradient(135deg,#f3f0ff 0%,#eaf1ff 100%);border:1px solid #d7ceff;position:relative}

<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Med<b>Care</b></div>
    <div class="prod">Provider Portal<br>Roster management</div>
    <nav class="nav" role="tablist" aria-label="Screens" id="tabs"></nav>
    <div class="sidefoot">Riverside Family Practice</div>
  </aside>
  <div class="mainwrap">
    <header class="bar">
      <div class="crumb" id="crumb"></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label class="sr" for="q">Search the roster</label><input id="q" type="search" placeholder="Search roster"></div>
      <div class="clock" id="clock"></div>
      <div class="avatar" title="Maya Fernandes">MF</div>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
</div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="toastHost"></div>
<script>
/* MedCare Provider Portal: single-file app. All data is fictional and lives in memory. */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  roster: '<path d="M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/>', send: '<path d="M4 12l16-8-6 16-3-7-7-1z"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', check: '<path d="M5 13l4 4L19 7"/>', code: '<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>', flow: '<path d="M5 6h4v4H5zM15 14h4v4h-4zM9 8h4a2 2 0 012 2v4"/>', upload: '<path d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/>'
};
const svg = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>';
function mkNpi(b9) { const d = ('80840' + b9).split('').reverse().map(Number); let sum = 0; d.forEach((x, i) => { if (i % 2 === 0) { x *= 2; if (x > 9) x -= 9; } sum += x; }); return b9 + ((10 - sum % 10) % 10); }
function npiValid(n) { if (!/^\d{10}$/.test(n)) return false; const d = ('80840' + n).split('').reverse().map(Number); let sum = 0; d.forEach((x, i) => { if (i % 2 === 1) { x *= 2; if (x > 9) x -= 9; } sum += x; }); return sum % 10 === 0; }
const p2 = n => ('0' + n).slice(-2);
const BASE = new Date('2026-11-11T09:00:00');
const dAdd = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dFmt = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const iso = d => new Date(d).toISOString().slice(0, 10);
const SPECS = ['Family Medicine', 'Internal Medicine', 'Pediatrics', 'Cardiology', 'Nurse Practitioner', 'Physician Assistant', 'OB-GYN', 'Dermatology'];
const LOCS = ['Main clinic (Oak St)', 'Pine Ave, Suite 210'];
const PLAN = 'Northwind Health Plan';
const PRAC = { name: 'Riverbend Family Medicine', tin: '**-***4821', admin: 'Maya Fernandes', address: '88 Oak St, Tampa FL 33602' };

/* synthetic state-board and NPPES registries */
const BOARD = { 'FL-ME41001': 'active', 'FL-ME41002': 'active', 'FL-ME41003': 'expired', 'FL-ME41004': 'active', 'FL-ME41005': 'active', 'FL-ME41006': 'active', 'FL-APRN2201': 'active', 'FL-PA3301': 'active', 'FL-ME41009': 'active', 'FL-ME41010': 'active', 'FL-ME41011': 'active', 'FL-APRN2202': 'active', 'FL-ME41003R': 'active', 'FL-ME52001': 'active', 'FL-ME52002': 'active', 'FL-ME52003': 'expired', 'FL-ME52004': 'active', 'FL-ME52005': 'active', 'FL-ME52006': 'active' };
const NPPES = [
  { npi: mkNpi('300000001'), name: 'Dr. Hana Kim', spec: 'Pediatrics', lic: 'FL-ME52001' },
  { npi: mkNpi('300000002'), name: 'Dr. Samuel Ortega', spec: 'Family Medicine', lic: 'FL-ME52002' },
  { npi: mkNpi('300000003'), name: 'Dr. Luis Barros', spec: 'Internal Medicine', lic: 'FL-ME52003' },
  { npi: mkNpi('300000004'), name: 'Dr. Neha Patel', spec: 'Internal Medicine', lic: 'FL-ME52004' },
  { npi: mkNpi('300000005'), name: 'Dr. Lucia Mendes', spec: 'Pediatrics', lic: 'FL-ME52005' },
  { npi: mkNpi('300000006'), name: 'Dr. Tom Hall', spec: 'Cardiology', lic: 'FL-ME52006' }
];
const SYS = [['claims', 'Claims processing'], ['pa', 'Prior authorization'], ['care', 'Care coordination']];

function seedProviders() {
  const L = [['Dr. Priya Nair', 'Family Medicine', 'FL-ME41001', 20], ['Dr. Marcus Webb', 'Internal Medicine', 'FL-ME41002', 35], ['Dr. Anil Rao', 'Internal Medicine', 'FL-ME41003', 70], ['Dr. Mei Zhang', 'Family Medicine', 'FL-ME41004', 130],
    ['Dr. Ravi Kapoor', 'Pediatrics', 'FL-ME41005', 12], ['Dr. Sofia Alvarez', 'Pediatrics', 'FL-ME41006', 48], ['Jordan Hale, NP', 'Nurse Practitioner', 'FL-APRN2201', 22], ['Tessa Brooks, PA-C', 'Physician Assistant', 'FL-PA3301', 91],
    ['Dr. Omar Siddiqui', 'Internal Medicine', 'FL-ME41009', 15], ['Dr. Lina Park', 'Family Medicine', 'FL-ME41010', 41], ['Dr. Henry Cole', 'Cardiology', 'FL-ME41011', 66], ['Nia Washington, NP', 'Nurse Practitioner', 'FL-APRN2202', 18]];
  return L.map((x, i) => ({ npi: mkNpi('2000000' + p2(i)), name: x[0], spec: x[1], lic: x[2], loc: i % 4 === 3 ? 'Pine Ave, Suite 210' : 'Main clinic (Oak St)', phone: '813-555-01' + p2(40 + i), status: 'active', start: '2023-0' + (1 + i % 9) + '-01', lv: x[3], claimsSilent: 5 + i, flag: i === 1 ? 'moved' : null }));
}
function seedQueue() {
  return [
    { id: 'Q-2041', practice: 'Lakeside Pediatrics', kind: 'add', name: 'Dr. Tomas Reyes', fields: [['NPI', '—', mkNpi('300000007')], ['Specialty', '—', 'Pediatrics'], ['License', '—', 'FL-ME52005 (active)']], checks: [['pass', 'NPI check digit valid'], ['pass', 'License active per state board'], ['pass', 'No duplicate on roster']], conf: 94, status: 'review', age: 1, mine: false },
    { id: 'Q-2042', practice: 'Northgate Cardiology', kind: 'remove', name: 'Dr. Alan Pierce', fields: [['Status', 'Active', 'Terminated'], ['Effective', '—', dFmt(dAdd(BASE, -52))]], checks: [['warn', 'Termination date is 52 days in the past'], ['warn', 'Claims still received 18 days ago'], ['pass', 'Submitted by verified practice admin']], conf: 62, status: 'review', age: 2, mine: false },
    { id: 'Q-2043', practice: 'Harbor Urgent Care', kind: 'update', name: 'Dr. Mia Cole', fields: [['Phone', '(813) 555 0177', '813-555-0177'], ['Location', 'Annex', 'Main clinic']], checks: [['pass', 'Phone format normalised, same number'], ['pass', 'Location exists on plan record']], conf: 91, status: 'review', age: 0, mine: false }
  ];
}
function fresh() {
  return { ver: 12, min: 0, providers: seedProviders(), drafts: [], changes: [], queue: seedQueue(), audit: [{ v: 12, t: dAdd(BASE, -2), actor: 'System', action: 'Roster snapshot', entity: PRAC.name, detail: '12 providers synced with ' + PLAN }], failUsed: false, seq: 3100 };
}
let S = fresh();
let ui = { role: 'provider', tab: 'roster', form: null, csv: null, aiDone: {}, aiT: {}, proc: null, q: '', sel: null, api: null, health: null };
function log(actor, action, entity, detail, bump) { if (bump) S.ver++; S.min += 3; S.audit.unshift({ v: S.ver, t: new Date(BASE.getTime() + S.min * 60000), actor, action, entity, detail }); }
const tm = t => new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function toast(msg, undo) { const h = $('#toastHost'); h.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; $('#live').textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(() => h.innerHTML = '', 3800); }

/* ---------- validation ---------- */
function validate(c) {
  const out = [], add = (sev, m) => out.push([sev, m]);
  const f = k => (c.val || {})[k];
  if (c.kind === 'add') {
    if (!npiValid(f('npi') || '')) add('err', 'NPI fails the check digit test');
    else add('pass', 'NPI check digit valid');
    if (S.providers.some(p => p.npi === f('npi') && p.status !== 'termed')) add('err', 'This NPI is already on the roster');
    const b = BOARD[f('lic')];
    if (!f('lic')) add('err', 'License number is required'); else if (b === 'active') add('pass', 'License active per state board'); else if (b) add('err', 'License is ' + b + ' per state board'); else add('warn', 'License not found at the state board');
    if (!f('spec')) add('err', 'Specialty is required'); else add('pass', 'Specialty recognised');
    const days = Math.round((BASE - new Date(f('eff'))) / 864e5); if (days > 60) add('warn', 'Start date is ' + days + ' days in the past');
  } else if (c.kind === 'update') {
    if (f('phone') && f('phone').replace(/\D/g, '').length !== 10) add('err', 'Phone must have 10 digits'); else if (f('phone')) add('pass', 'Phone format valid');
    if (f('lic')) { const b = BOARD[f('lic')]; if (b === 'active') add('pass', 'New license active per state board'); else if (b) add('err', 'New license is ' + b + ' per state board'); else add('err', 'New license not found at the state board'); }
    if (f('spec') && c.old && f('spec') !== c.old.spec) add('warn', 'Specialty change affects network adequacy and needs plan review');
    if (c.fields && c.fields.some(f => /location/i.test(f[0]))) add('warn', 'New service location needs a plan site check');
    if (!out.length) add('pass', 'No risky changes detected');
  } else if (c.kind === 'remove') {
    const days = Math.round((BASE - new Date(f('eff'))) / 864e5);
    if (days > 30) add('warn', 'End date is ' + days + ' days in the past'); else add('pass', 'End date is current');
    add('pass', 'Submitted by verified practice admin');
  }
  const errs = out.filter(x => x[0] === 'err').length, warns = out.filter(x => x[0] === 'warn').length;
  c.checks = out; c.conf = Math.max(20, 98 - errs * 28 - warns * 14);
  c.route = errs ? 'blocked' : (warns || c.conf < 90) ? 'review' : 'auto';
  return c;
}
function stage(c) { c.id = 'D-' + (++S.seq); c.status = 'draft'; c.mine = true; c.practice = PRAC.name; validate(c); S.drafts = S.drafts.filter(d => !(d.kind === c.kind && d.pid === c.pid && c.pid)); S.drafts.push(c); log(PRAC.admin, 'Drafted ' + c.kind, c.name, c.fields.map(f => f[0] + ': ' + f[1] + ' → ' + f[2]).join('; ')); }

/* ---------- processing helper ---------- */
function run(key, title, steps, ms, done) { ui.proc = { key, title, steps }; render(); setTimeout(() => { ui.proc = null; done(); render(); }, ms); }
function procCard() { const p = ui.proc; return '<div class="ai think" role="status" aria-live="polite"><div class="aih"><span class="spark"></span><b>' + esc(p.title) + '</b></div><ul>' + p.steps.map((x, i) => '<li style="animation-delay:' + (i * .25) + 's"><i></i>' + esc(x) + '</li>').join('') + '</ul><div class="aibar"><i></i></div></div>'; }

/* ---------- roster actions ---------- */
function applyChange(c) {
  const by = c.mine ? 'Plan rules' : 'Plan reviewer';
  if (c.mine) {
    if (c.kind === 'add') S.providers.push({ npi: c.val.npi, name: c.name, spec: c.val.spec, lic: c.val.lic, loc: c.val.loc || 'Main clinic', phone: '813-555-0140', status: 'active', start: c.val.eff, lv: 0, claimsSilent: 0, isNew: true });
    if (c.kind === 'update') { const p = S.providers.find(x => x.npi === c.pid); Object.assign(p, { spec: c.val.spec || p.spec, phone: c.val.phone || p.phone, loc: c.val.addLoc ? p.loc + ' + ' + c.val.loc : (c.val.loc || p.loc), lic: c.val.lic || p.lic, lv: 0 }); }
    if (c.kind === 'remove') { const p = S.providers.find(x => x.npi === c.pid); p.status = 'termed'; p.end = c.val.eff; }
  }
  c.status = 'accepted'; log(by, 'Accepted ' + c.kind, c.name, c.fields.map(f => f[0] + ': ' + f[1] + ' → ' + f[2]).join('; ') + ' (' + c.practice + ')', true);
  c.ds = { claims: 'queued', pa: 'queued', care: 'queued' }; c.ver = S.ver;
  if (c.mine && !S.failUsed && c.fields.some(f => /location/i.test(f[0]))) { c.failOnce = true; S.failUsed = true; }
  S.changes.unshift(c); push(c);
}
function push(c, from) {
  from = from || 0; const set = (k, v) => { c.ds[k] = v; log('Integration', 'Delivery ' + v, c.name, SYS.find(x => x[0] === k)[1], false); soft(); };
  const step = i => { if (i >= SYS.length) return; const k = SYS[i][0]; c.ds[k] = 'sending'; soft();
    setTimeout(() => { if (k === 'claims' && c.failOnce) { c.ds[k] = 'failed'; c.dsErr = 'Claims rejected the new location: the service-location ID for Pine Ave, Suite 210 is missing.'; log('Integration', 'Delivery failed', c.name, 'Claims processing: service-location ID missing', false); soft(); return; } set(k, 'delivered'); step(i + 1); }, 750); };
  step(from);
}
function soft() { if (['submissions', 'downstream', 'roster'].includes(ui.tab) && !ui.proc) render(); }
function submitAll() {
  const ds = S.drafts.slice(); if (!ds.length) return;
  run('submit', 'Validating ' + ds.length + ' change' + (ds.length === 1 ? '' : 's') + ' against ' + PLAN + ' rules…', ['Checking NPIs against NPPES', 'Checking licenses with the state board', 'Comparing with the plan record', 'Deciding: auto-accept or plan review'], 1700, () => {
    let a = 0, r = 0;
    ds.forEach(c => { c.age = 0; log(PRAC.admin, 'Submitted ' + c.kind, c.name, 'AI confidence ' + c.conf, false); if (c.route === 'auto') { a++; applyChange(c); } else { r++; c.status = 'review'; c.reviewWhy = c.checks.filter(x => x[0] === 'warn').map(x => x[1]).join('; '); S.queue.unshift(c); } });
    S.drafts = []; ui.tab = 'submissions'; ui.submitMsg = a + ' accepted automatically' + (r ? ', ' + r + ' sent to ' + PLAN + ' for review' : '') + '.'; toast(ui.submitMsg);
  });
}

/* ---------- AI recommendation (plan reviewer) ---------- */
function planRec(c) {
  const warn = c.checks.filter(x => x[0] === 'warn').map(x => x[1]);
  let title, act = 'approve', why = c.checks.map(x => x[1]);
  if (c.kind === 'remove' && warn.length) { title = 'Request confirmation of the end date'; act = 'info'; }
  else if (c.conf >= 85) { title = 'Approve: low risk, all checks pass'; }
  else { title = 'Approve with a note'; }
  return { title, act, why, lvl: c.conf >= 85 ? 'High' : c.conf >= 65 ? 'Medium' : 'Low' };
}
function aiCard(c) {
  if (!ui.aiDone[c.id]) { if (!ui.aiT[c.id]) ui.aiT[c.id] = setTimeout(() => { ui.aiDone[c.id] = true; render(); }, 900); return '<div class="ai think" role="status"><div class="aih"><span class="spark"></span><b>AI is reviewing this change…</b></div><ul><li style="animation-delay:0s"><i></i>Comparing with the plan record</li><li style="animation-delay:.22s"><i></i>Checking NPPES and state board</li><li style="animation-delay:.44s"><i></i>Assessing claims and network impact</li></ul><div class="aibar"><i></i></div></div>'; }
  const g = planRec(c);
  return '<div class="ai"><div class="aih"><span class="spark"></span><b>AI recommendation</b><span class="badge b-outreach" style="margin-left:auto">' + g.lvl + ' confidence</span></div><div class="ait">' + esc(g.title) + '</div><ul class="aiw">' + g.why.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul><div class="row"><button class="btn primary sm" data-act="aiApply" data-do="' + g.act + '">Apply: ' + (g.act === 'info' ? 'request info' : 'approve') + '</button><span class="small muted">You can override below.</span></div></div>';
}

/* ---------- views ---------- */
const NAV = { provider: [['roster', 'Roster', 'roster'], ['submit', 'Review and submit', 'check'], ['submissions', 'Submissions', 'flow'], ['audit', 'Audit trail', 'clock']], plan: [['review', 'Exception queue', 'list'], ['downstream', 'Downstream', 'send'], ['audit', 'Audit trail', 'clock']] };
const PT = { roster: ['Provider portal', 'Your roster, always current'], submit: ['Provider portal', 'Review and submit'], submissions: ['Provider portal', 'Submissions and delivery'], audit: ['Compliance', 'Audit trail and versions'], review: ['Plan operations', 'Exception queue: changes that need a person'], api: ['Plan operations', 'Query a roster on demand'], downstream: ['Plan operations', 'Delivery to downstream systems'] };

  $('#app').innerHTML = '<div role="tabpanel">' + v() + '</div>';
  if (keep) { const el = document.querySelector('[data-f="' + keep[0] + '"]'); if (el) { el.focus(); try { el.setSelectionRange(keep[1], keep[1]); } catch (e) { } } }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, id = t.dataset.id;
  const find = n => S.providers.find(p => p.npi === n);
  switch (a) {
    case 'tab': ui.tab = id; ui.submitMsg = null; break;
    case 'role': ui.role = id; ui.tab = NAV[id][0][0]; ui.form = null; ui.csv = null; break;
    case 'reset': S = fresh(); ui = { role: 'provider', tab: 'roster', form: null, csv: null, aiDone: {}, aiT: {}, proc: null, q: '', sel: null, api: null, health: null }; toast('Reset to the starting state.'); break;
    case 'addForm': ui.csv = null; ui.form = { mode: 'add', v: { eff: iso(BASE) }, msg: null }; break;
    case 'editForm': ui.csv = null; { const p = find(id); ui.form = { mode: 'edit', p, v: { spec: p.spec, loc: p.loc, phone: p.phone, lic: '' } }; } break;
    case 'hEdit': { const p = find(id); ui.form = { mode: 'edit', p, v: { spec: p.spec, loc: p.loc, phone: p.phone, lic: '' } }; break; }
    case 'removeForm': case 'hRemove': { const p = find(id); ui.csv = null; ui.form = { mode: 'remove', p, v: { eff: iso(dAdd(BASE, a === 'hRemove' ? -8 : 0)), why: a === 'hRemove' ? 'Left the practice' : '' } }; break; }
    case 'hLoc': { const p = find(id); S.locDone = true; stage({ kind: 'update', pid: p.npi, name: p.name, old: p, val: { loc: 'Pine Ave, Suite 210', addLoc: true }, fields: [['Add location', '—', 'Pine Ave, Suite 210']] }); toast('Added to Review and submit.'); break; }
    case 'formClose': ui.form = null; break;
    case 'useNpi': ui.form.v.npi = id; ui.form.msg = null; break;
    case 'lookup': { const n = (ui.form.v.npi || '').trim(); if (!/^\d{10}$/.test(n)) { ui.form.msg = ['err', 'Enter a 10-digit NPI. Your entry was kept.']; break; } if (!npiValid(n)) { ui.form.msg = ['err', 'This NPI fails the check digit test. Check for a typo and try again.']; break; }
      run('lookup', 'AI is looking up this NPI…', ['Matching NPPES registry', 'Checking state board license', 'Checking the plan record'], 1100, () => { const r = NPPES.find(x => x.npi === n); if (!r) { ui.form.msg = ['err', 'No NPPES match for this NPI. You can still fill the fields manually.']; return; } Object.assign(ui.form.v, { name: r.name, spec: r.spec, lic: r.lic }); ui.form.msg = ['ok', 'Found in NPPES: ' + r.name + ', ' + r.spec + '. License ' + r.lic + ' is ' + BOARD[r.lic] + ' per the state board. Details filled in.']; }); return; }
    case 'formStage': { const f = ui.form; if (f.mode === 'add') { const v = f.v; if (!v.name || !v.npi) { f.err = 'Name and NPI are required. Your other entries were kept.'; break; } stage({ kind: 'add', pid: v.npi, name: v.name, val: Object.assign({}, v), fields: [['NPI', '—', v.npi], ['Specialty', '—', v.spec || 'missing'], ['License', '—', v.lic || 'missing'], ['Start', '—', dFmt(v.eff)]] }); }
      else if (f.mode === 'edit') { const v = f.v, p = f.p, ch = []; if (v.spec && v.spec !== p.spec) ch.push(['Specialty', p.spec, v.spec]); if (v.loc && v.loc !== p.loc) ch.push(['Location', p.loc, v.loc]); if (v.phone && v.phone !== p.phone) ch.push(['Phone', p.phone, v.phone]); if (v.lic) ch.push(['License', p.lic, v.lic]); if (!ch.length) { f.err = 'Nothing changed yet. Edit a field first.'; break; } stage({ kind: 'update', pid: p.npi, name: p.name, old: p, val: { spec: v.spec, loc: v.loc, phone: v.phone, lic: v.lic }, fields: ch }); }
      else { const v = f.v, p = f.p; if (!v.eff || !v.why) { f.err = 'Choose the last day and a reason. Your entries were kept.'; break; } stage({ kind: 'remove', pid: p.npi, name: p.name, val: { eff: v.eff }, fields: [['Status', 'Active', 'Terminated'], ['Last day', '—', dFmt(v.eff)], ['Reason', '—', v.why]] }); }
      ui.form = null; toast('Added to Review and submit.'); break; }
    case 'csvOpen': ui.form = null; ui.csv = { res: null }; break;
    case 'csvClose': ui.csv = null; break;
    case 'csvSample': runCsv(csvText()); return;
    case 'csvFix': ui.csv.res.forEach(x => { if (!x.ok && x.fix && x.fixv) { if (x.fixv.npi) x.r.npi = x.fixv.npi; if (x.fixv.specialty) x.r.specialty = x.fixv.specialty; } }); ui.csv.res = csvEval(ui.csv.res.map(x => x.r)); toast('AI fixes applied. Re-checked all rows.'); break;
    case 'csvStage': { let n = 0; ui.csv.res.filter(x => x.ok).forEach(x => { stage({ kind: 'add', pid: x.r.npi, name: x.r.name, val: { npi: x.r.npi, spec: x.r.specialty, lic: x.r.license, eff: x.r.start || iso(BASE) }, fields: [['NPI', '—', x.r.npi], ['Specialty', '—', x.r.specialty], ['License', '—', x.r.license], ['Start', '—', dFmt(x.r.start || BASE)]] }); n++; }); ui.csv = null; ui.tab = 'submit'; toast(n + ' provider' + (n === 1 ? '' : 's') + ' added to Review and submit.'); break; }
    case 'discard': S.drafts = S.drafts.filter(d => d.id !== id); toast('Draft discarded.'); break;
    case 'submit': submitAll(); return;
    case 'respond': { const c = S.queue.find(x => x.id === id); c.status = 'review'; c.ask = null; log(PRAC.admin, 'Responded to plan', c.name, 'Provider confirmed the information'); toast('Response sent. Back in plan review.'); break; }
    case 'fixDs': { const c = S.changes.find(x => x.id === id); c.failOnce = false; c.dsErr = null; log(PRAC.admin, 'Added service-location ID and retried', c.name, 'Pine Ave, Suite 210 → SL-88210'); push(c, 0); toast('Retrying delivery with the service-location ID.'); break; }
    case 'pick': ui.sel = id; ui.rjErr = null; break;
    case 'aiApply': { const b = document.querySelector('.ws [data-act="' + t.dataset.do + '"]'); if (b) setTimeout(() => b.click(), 0); return; }
    case 'approve': { const c = S.queue.find(x => x.id === ui.sel); S.queue = S.queue.filter(x => x !== c); applyChange(c); toast(c.name + ' approved. Sending to downstream systems.'); break; }
    case 'info': { const c = S.queue.find(x => x.id === ui.sel); c.status = 'info'; c.ask = c.kind === 'remove' ? 'Please confirm the termination date and that no claims are expected after it.' : 'Please confirm the details of this change.'; log('Plan reviewer', 'Requested information', c.name, c.ask); toast('Request sent to ' + c.practice + '.'); break; }
    case 'reject': { const r = $('#rj').value; if (!r) { ui.rjErr = 'Choose a reject reason first. The change was not rejected.'; break; } const c = S.queue.find(x => x.id === ui.sel); c.status = 'rejected'; c.rejWhy = r; log('Plan reviewer', 'Rejected', c.name, r); ui.rjErr = null; toast(c.name + ' rejected.'); break; }
    case 'apiRun': ui.apiq = $('#apiq').value; run('api', 'Querying the live roster…', ['Resolving practice', 'Reading the latest accepted version'], 800, () => { ui.api = { practice: PRAC.name, tin: PRAC.tin, plan: PLAN, version: S.ver, as_of: S.audit[0].t, providers: S.providers.map(p => ({ npi: p.npi, name: p.name, specialty: p.spec, status: p.status === 'active' ? 'active' : 'terminated', location: p.loc, license: p.lic, last_verified_days: p.lv })) }; }); return;
    case 'copyApi': try { navigator.clipboard.writeText(JSON.stringify(ui.api, null, 2)).then(() => toast('JSON copied.'), () => toast('Copy was blocked here. Select the text and copy it.')); } catch (er) { toast('Copy was blocked here. Select the text and copy it.'); } return;
    case 'copyAudit': { const csv = ['version,when,actor,action,entity,detail'].concat(S.audit.map(x => ['v' + x.v, tm(x.t), x.actor, x.action, x.entity, x.detail].map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))).join('\n'); try { navigator.clipboard.writeText(csv).then(() => toast('Audit trail copied as CSV (' + S.audit.length + ' rows).'), () => toast('Copy was blocked here. Select the table and copy it.')); } catch (er) { toast('Copy was blocked here.'); } return; }
  }
  render();
});
function runCsv(text) { try { const pc = parseCsv(text), rows = pc.rows; if (!rows.length) throw 0; ui.csv.map = pc.map; run('csv', 'AI is reading your file…', ['Mapping columns: npi, name, specialty, license, start', 'Checking ' + rows.length + ' rows against NPPES and the state board', 'Looking for duplicates and suggesting fixes'], 1600, () => { ui.csv.res = csvEval(rows); }); } catch (er) { ui.csv.err = 'The file has no data rows. Add at least one provider under the header row.'; render(); } }
document.addEventListener('change', e => { if (e.target.id === 'csvFile') { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => runCsv(String(r.result)); r.readAsText(f); } else if (e.target.dataset.f && ui.form) { ui.form.v[e.target.dataset.f] = e.target.value; } });
document.addEventListener('input', e => { if (e.target.dataset.f && ui.form) ui.form.v[e.target.dataset.f] = e.target.value; else if (e.target.id === 'q') { ui.q = e.target.value; if (ui.role === 'provider' && ui.tab !== 'roster') ui.tab = 'roster'; render(); } });
render();

</script>
</body>
