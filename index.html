<head>

<title>MCheck Directory Accuracy: Verification Command Center (Simulated Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2a6af1;--blue-d:#1f55c8;--navy:#072669;--navy-d:#051a47;--ink:#29303d;--muted:#465167;--bg:#f4f7fd;--card:#fff;--bd:#cfdcf8;--bd2:#e3eaf8;--green:#4f8a10;--greenL:#e9f5d6;--yellow:#946a00;--yellowL:#fff3cc;--orange:#b85a00;--orangeL:#ffe9d2;--red:#c42d2d;--redL:#fde4e4;--purple:#6a3dd0;--blueL:#e6eefe;--grey:#6b7587}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14.5px/1.5 "Plus Jakarta Sans",Satoshi,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0;color:var(--navy);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.6rem}h3{font-size:1.02rem}
button,input,select{font:inherit}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:1.65rem;letter-spacing:-.02em;padding:2px 10px 0}
.brand b{color:#5b8cff}.brand sup{font-size:.45em;font-weight:600;opacity:.8}
.prod{padding:0 10px 14px;font-size:.78rem;color:#b9c7ee;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#cfdaf7;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:.92rem}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-selected="true"]{background:var(--blue);color:#fff}
.nav .num{margin-left:auto;background:#fff;color:var(--navy);border-radius:999px;font-size:.72rem;padding:0 7px;font-weight:800}
.sidefoot{margin-top:auto;font-size:.72rem;color:#9fb1e2;padding:8px 10px}
.mainwrap{flex:1;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border-bottom:1px solid var(--bd2);padding:10px 24px;position:sticky;top:0;z-index:5}
.crumb{font-weight:700;color:var(--navy);flex:1 1 220px}
.crumb span{color:var(--muted);font-weight:500}
.search{flex:0 1 280px;position:relative}
.search input{width:100%;border:1.5px solid var(--bd);border-radius:999px;padding:8px 14px 8px 36px;background:var(--bg)}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--grey)}
.sim{background:linear-gradient(90deg,#29b2e6,#5d3fd3);color:#fff;font-weight:800;font-size:.72rem;padding:5px 11px;border-radius:999px;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blueL);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.8rem}
main{padding:22px 24px 8px;max-width:1280px;outline:none}
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:800;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}
.eyebrow svg{width:14px;height:14px}
.phead{margin-bottom:14px}
.phead p{margin:4px 0 0;color:var(--muted);max-width:760px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(7,38,105,.05)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--blueL)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(90deg,#29b2e6,#5d3fd3)}
.btn.primary:hover{filter:brightness(.93)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--redL)}
.btn.sm{padding:5px 12px;font-size:.86rem;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-block;border:1.5px solid;border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:700;white-space:nowrap}
.b-auto{background:var(--greenL);color:var(--green);border-color:#a8d26a}
.b-outreach{background:var(--blueL);color:var(--blue-d);border-color:#9bb8f8}
.b-human{background:var(--yellowL);color:var(--yellow);border-color:#f0c64d}
.b-ready{background:var(--greenL);color:var(--green);border-color:#a8d26a}
.b-done{background:#eef1f6;color:var(--grey);border-color:#c9d0dc}
.b-bad{background:var(--redL);color:var(--red);border-color:#f0a1a1}
.b-sim{background:#efe9fd;color:var(--purple);border-color:#c8b8f3}
.tw{border:1.5px solid var(--bd);border-radius:14px;overflow:auto;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;vertical-align:top;font-size:.9rem;border-bottom:1px solid var(--bd2)}
th{background:#eef3fd;color:var(--navy);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8faff}
td.num,th.num{text-align:right}
.diff{background:var(--yellowL)}
.kpi{background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(7,38,105,.05)}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:600}

.kpi .d{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:0 8px;margin-top:2px}
.d-up{background:var(--greenL);color:var(--green)}.d-flat{background:#eef1f6;color:var(--grey)}.d-bad{background:var(--redL);color:var(--red)}
.bar2{height:10px;background:#e3eaf8;border-radius:5px;margin:4px 0}
.bar2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#29b2e6,#2a6af1)}
.bar2 i.base{background:#aab6cf}
.banner{border:1.5px solid;border-radius:12px;padding:9px 12px;margin:10px 0;font-size:.9rem}
.ban-err{background:var(--redL);border-color:#f0a1a1}.ban-ok{background:var(--greenL);border-color:#a8d26a}.ban-warn{background:var(--yellowL);border-color:#f0c64d}.ban-info{background:var(--blueL);border-color:#9bb8f8}
.alertchip{display:inline-flex;align-items:center;gap:6px;background:var(--redL);color:var(--red);border-radius:8px;padding:2px 9px;font-weight:700;font-size:.78rem}
.steps{margin:6px 0 0;padding-left:20px}
.spinner{display:inline-block;width:14px;height:14px;border:3px solid var(--bd);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}

@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.pillstat .ic{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.pillstat .ic svg{width:18px;height:18px}

.legend{display:grid;gap:5px;font-size:.84rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;background:#eef1f8;border-radius:5px;padding:0 6px;font-size:.74rem}
.legend span{min-width:150px}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:#fff;border-left:2px solid var(--navy);box-shadow:-10px 0 28px rgba(7,38,105,.25);overflow-y:auto;z-index:20;padding:18px}
.scrim{position:fixed;inset:0;background:rgba(7,38,105,.4);z-index:10}
fieldset{border:1.5px solid var(--bd);border-radius:12px;margin:8px 0;padding:6px 12px}
legend{font-weight:700;font-size:.86rem;padding:0 4px;color:var(--navy)}
label.opt{display:block;padding:2px 0;font-size:.9rem}
select,input[type=number],input[type=text]{border:1.5px solid var(--bd);border-radius:10px;padding:6px 10px;background:#fff}
input[type=number]{width:90px}
.r3{display:grid;gap:6px;margin:8px 0}
.r3 div{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:.84rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;max-width:92%;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
footer{padding:6px 24px 28px;color:var(--grey);font-size:.78rem;max-width:1280px}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 12px}
  .prod,.sidefoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .nav button{white-space:nowrap;padding:8px 12px}
  main{padding:14px 12px}.bar{padding:8px 12px}
  h2{font-size:1.3rem}.kpi .v{font-size:1.6rem}
}

<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Hi<b>Labs</b><sup>™</sup></div>
    <div class="prod">MCheck® Directory Accuracy<br>Verification Command Center</div>
    <nav class="nav" role="tablist" aria-label="Screens" id="tabs"></nav>
    <div class="sidefoot">Concept prototype modelled on HiLabs' public product style. Not an official HiLabs product.</div>
  </aside>
  <div class="mainwrap">
    <header class="bar">
      <div class="crumb" id="crumb"></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label class="sr" for="q">Search providers by name, NPI or specialty</label><input id="q" type="search" placeholder="Search provider, NPI, specialty" autocomplete="off"></div>
      <span class="sim">SIMULATED DEMO DATA</span>
      <div class="clock" id="clock"></div>
      <div class="avatar" title="A. Rao (demo analyst)">AR</div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer id="foot"></footer>
  </div>
</div>
<div id="drawerHost"></div>
<div id="live" class="sr" aria-live="polite" role="status"></div>
<div id="toastHost"></div>
<script>

/* =====================================================================
   CONFIG: everything that changes between problem statements lives here.
   Swap names, fields, sources, thresholds, reason codes, downstream systems,
   KPIs and records; the logic below reads only from CONFIG.
   ===================================================================== */
const CONFIG = {
  caseName: 'Meridian Directory Command Center',
  operator: 'A. Rao (demo analyst)',
  owners: ['A. Rao', 'S. Mehta', 'Unassigned'],
  packs: { validation: true, normalise: true, costSim: true, adequacy: true, ask: true, board: true, rollup: true },  // feature packs: switch off what a case does not need
  minPerSpecCounty: 4,               // adequacy standard (assumption): providers per specialty per county
  costs: { wrongPublish: 150, review: 12, errorK: 0.4 },  // illustrative cost model, editable in the UI
  baseDate: '2026-11-11',            // simulated day 0 (a Wednesday)
  noun: { one: 'provider', many: 'providers' },
  thresholds: { auto: 90, low: 60, cadenceDays: 90, claimsSilentDays: 120, removalSLA: 5, outreachSLA: 2, exceptionSLA: 2 },
  targets: { fresh: 95, removalSLA: 98, accuracy: 95, exceptionAge: 2 },
  fields: [
    { key: 'address', label: 'Address' },
    { key: 'phone', label: 'Phone' },
    { key: 'accepting', label: 'Accepting new patients' }
  ],

  return '<div class="card" style="margin-bottom:14px"><h3>Ask about this queue <span class="badge b-sim">Simulated assistant</span></h3><p class="muted small" style="margin:2px 0 8px">Rule-based answers computed from the current data. No live AI model is called.</p><div class="row">' + ASKQ.map(([k, q]) => '<button class="btn sm ' + (ui.ask === k ? 'on' : '') + '" data-act="ask" data-id="' + k + '" aria-pressed="' + (ui.ask === k) + '">' + q + '</button>').join('') + '</div>' + (ui.ask ? '<div class="banner ban-info" role="status" style="margin-bottom:0"><b>' + esc(ASKQ.find(x => x[0] === ui.ask)[1]) + '</b><br>' + esc(askAnswer(ui.ask)) + '</div>' : '') + '</div>';
}
function vExceptions() {

  if (!ex.length) return out + '<div class="banner ban-ok">No open exceptions match. (Empty state: nothing needs a human right now.)</div></div>';
  out += '<div class="tw"><table><thead><tr><th>Provider</th><th>Why it is here</th><th>Owner</th><th class="num">Age (BD)</th><th>SLA</th><th>Action</th></tr></thead><tbody>' + ex.map(r => {

function vDownstream() {

  const pend = pending();
  const rows = S.recs.filter(r => ['approved', 'removed', 'acked', 'removed_acked', 'rejected'].includes(r.stage) && matchQ(r));
  let out = phead('downstream') + kpiStrip() + '<div class="card"><div class="row"><h3 style="flex:1">Push status <span class="badge b-sim">Simulated</span></h3><button class="btn primary" data-act="push" ' + (pend.length ? '' : 'disabled') + '>Push ' + pend.length + ' pending change' + (pend.length === 1 ? '' : 's') + '</button></div>'
    + '<p class="small muted">Targets: Directory website and Facets (core admin). No real system is contacted.</p>';
  if (!rows.length) return out + '<div class="banner ban-info">Nothing to push yet. Approve or remove records in Directory review first. (Empty state.)</div></div>';
  out += '<div class="tw"><table><thead><tr><th>Provider</th><th>Change</th><th>Directory website</th><th>Facets</th><th>Status</th></tr></thead><tbody>' + rows.map(r => {
    const chg = r.push || (r.stage === 'removed_acked' ? 'remove' : 'update');
    const st = s => s === 'ack' ? '<span class="badge b-ready">✓ Acknowledged</span>' : s === 'rejected' ? '<span class="badge b-bad">✕ Rejected</span>' : '<span class="badge b-done">Pending</span>';
    let extra = '';

}

function donut() {
  const tot = S.recs.length; const gone = r => r.stage === 'removed' || r.stage === 'removed_acked';
  const cats = [['Auto verified', '#7ab51d', S.recs.filter(r => !gone(r) && r.stage !== 'rejected' && r.autoApproved).length], ['Manually verified', '#e8b92f', S.recs.filter(r => !gone(r) && r.stage !== 'rejected' && r.approvedBy && !r.autoApproved).length],
    ['Push rejected', '#d93b3b', S.recs.filter(r => r.stage === 'rejected').length], ['Removed', '#8a95a8', S.recs.filter(gone).length]];
  cats.push(['In progress', '#ef7d12', tot - cats.reduce((a, c) => a + c[2], 0)]);
  const R = 54, C = 2 * Math.PI * R; let off = 0, segs = '';
  cats.forEach(c => { const len = tot ? C * c[2] / tot : 0; segs += '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + c[1] + '" stroke-width="20" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '"/>'; off += len; });
  return '<div class="donutwrap" role="img" aria-label="Entries by status: ' + cats.map(c => c[0] + ' ' + c[2]).join(', ') + '"><svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true"><g transform="rotate(-90 70 70)">' + segs + '</g><text x="70" y="66" text-anchor="middle" font-size="9" fill="#465167">Total count</text><text x="70" y="84" text-anchor="middle" font-size="18" font-weight="800" fill="#072669">' + tot + '</text></svg><div class="legend">' + cats.map(c => '<div><i style="background:' + c[1] + '"></i><span>' + c[0] + '</span><b>' + c[2] + '</b></div>').join('') + '</div></div>';
}
function bar2(label, base, now, target, note) {
  return '<div class="card"><h3>' + esc(label) + '</h3><div class="small muted">Baseline (at load) ' + fmtPct(base) + '</div><div class="bar2" aria-hidden="true"><i class="base" style="width:' + (base || 0) + '%"></i></div><div class="small"><b>Now ' + fmtPct(now) + '</b>' + (target != null ? ' · target ≥' + target + '%' : '') + '</div><div class="bar2" aria-hidden="true"><i style="width:' + (now || 0) + '%"></i></div><div class="small muted">' + esc(note) + '</div></div>';
}

    + '<div class="pillstat"><span class="ic">' + svg('send') + '</span><span><div class="t">Downstream acknowledgement</div><div class="v">' + fmtPct(m.ackRate) + '</div></span></div></div>';

    + '<div class="kpi"><div class="l">Auto-verify rate</div><div class="v">' + fmtPct(m.autoRate) + '</div><div class="small muted">auto-approved ÷ all approvals (' + m.approvals + ')</div></div>'
    + '<div class="kpi"><div class="l">Exception age, target ≤' + T.exceptionAge + ' BD</div><div class="v">' + (m.exMedian == null ? '–' : m.exMedian) + '</div><div class="small muted">median business days, open exceptions (' + m.exOpen + ')</div></div>'
    + '<div class="kpi"><div class="l">Downstream acknowledgement</div><div class="v">' + fmtPct(m.ackRate) + '</div><div class="small muted">acknowledged ÷ pushed (' + m.pushed + ')</div></div></div>'

  out += '<div class="card"><div class="row"><h3 style="flex:1">Audit log (' + S.audit.length + ')</h3><button class="btn sm" data-act="copyAudit">Copy log as CSV</button></div><p class="small muted">Every change records who, what, why and when (simulated clock). Downloads are not available in this view, so use Copy.</p>'
    + '<div class="tw" style="max-height:340px"><table><thead><tr><th class="num">#</th><th>When</th><th>Action</th><th>Provider</th><th>Reason</th><th>Detail</th></tr></thead><tbody>' + S.audit.map(e => '<tr><td class="num">' + e.n + '</td><td class="small">' + esc(e.date) + '</td><td>' + esc(e.action) + '</td><td>' + esc(e.name) + '</td><td class="small">' + esc(e.reason) + '</td><td class="small">' + esc(e.detail) + '</td></tr>').join('') + '</tbody></table></div></div>';

function r3bars(a) {
  const b = (l, v) => '<div><span>' + l + '</span><span class="bar2" aria-hidden="true"><i style="width:' + Math.round(v * 100) + '%"></i></span><b>' + Math.round(v * 100) + '</b></div>';
  return '<div class="r3" aria-label="R3 score breakdown">' + b('Reliability', a.reliab) + b('Relevance', a.agree) + b('Recency', a.recency) + '</div>';
}
function vDrawer() { return ui.tab === 'queue' && S.loaded ? '' : vRec(false); }

}

/* ============================ events ============================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id; lastTrigger = t;
  let focusSel = '[data-act="' + act + '"]' + (id ? '[data-id="' + id + '"]' : '');
  switch (act) {
    case 'tab': ui.tab = id; ui.open = null; ui.drawerMsg = null; ui.bulkMsg = null; focusSel = '#tab-' + id; break;
    case 'load': ingest('ok'); return;
    case 'loadBad': ingest('bad'); return;
    case 'loadEmpty': ingest('empty'); return;
    case 'advance': S.simDay++; log('Simulated clock advanced', null, '', 'Day ' + S.simDay + ' (' + dateOf(S.simDay) + ')'); toast('Advanced to ' + dateOf(S.simDay) + '. Evidence is one day older; timers moved.'); break;
    case 'reset': Object.assign(CONFIG.thresholds, TH0); Object.assign(CONFIG.costs, { wrongPublish: 150, review: 12 }); ui.costOpen = false; ui.ask = null; S = freshState(); ui = { tab: 'ingest', open: null, lane: 'all', loading: false, ingest: null, drawerMsg: null, bulk: false, bulkMsg: null, sel: {}, tax: {}, taxMsg: {}, auditMsg: '', filterQ: '' }; $('#q').value = ''; toast('Reset to the initial state.'); focusSel = '#tab-ingest'; break;
    case 'next': { const l = S.recs.filter(r => open(r) && (ui.lane === 'all' || analyse(r).lane === ui.lane) && matchQ(r)); const k = l.findIndex(r => r.id === ui.open); const n = l[k + 1] || l[0]; if (n) { ui.open = n.id; ui.drawerMsg = null; ui.reason = ''; ui.rmTick = false; } focusSel = '#dTitle'; break; }
    case 'qview': ui.qview = id; break;
    case 'boardOpen': ui.qview = 'inbox'; ui.lane = 'all'; ui.open = id; ui.drawerMsg = null; ui.reason = ''; ui.rmTick = false; focusSel = '#dTitle'; break;
    case 'ask': ui.ask = ui.ask === id ? null : id; break;
    case 'lane': ui.lane = id; break;
    case 'openRec': ui.open = id; ui.drawerMsg = null; ui.reason = ''; ui.rmTick = false; focusSel = '#dTitle'; break;
    case 'closeRec': focusSel = ui.open ? '[data-act="openRec"][data-id="' + ui.open + '"]' : null; ui.open = null; ui.drawerMsg = null; break;
    case 'bulkOpen': ui.qaTick = false; ui.bulk = true; ui.bulkMsg = null; ui.bulkErr = ''; break;
    case 'bulkCancel': ui.bulk = false; break;
    case 'bulkConfirm': ui.qaTick = $('#qaTick').checked; if (!ui.qaTick) { ui.bulkErr = 'Tick the box to confirm you spot-checked the sample. Nothing was approved.'; break; } bulkApprove(); ui.open = null; focusSel = '#app'; break;
    case 'outreach': doOutreach(id); focusSel = '#dTitle'; break;
    case 'reply': doReply(id); focusSel = '#dTitle'; break;
    case 'approve': ui.reason = $('#reason').value; doApprove(id, ui.reason); focusSel = ui.open ? '#dTitle' : '#app'; break;
    case 'escalate': doEscalate(id); focusSel = '#app'; break;
    case 'remove': ui.reason = $('#reason').value; ui.rmTick = $('#rmTick').checked; doRemove(id, ui.reason, ui.rmTick); focusSel = ui.open ? '#dTitle' : '#app'; break;
    case 'reinstate': doReinstate(id); focusSel = '#app'; break;
    case 'push': { const n = pushAll(); toast(n + ' change' + (n === 1 ? '' : 's') + ' pushed (simulated). Check acknowledgements.'); break; }
    case 'fix': ui.tax[id] = $('#tx-' + id).value; fixRetry(id); break;
    case 'audit': S.auditRun = auditAccuracy(); ui.auditMsg = 'Audit sample run on day ' + S.simDay + ': ' + S.auditRun + '% of sampled fields match the synthetic ground truth.'; log('Audit sample run', null, '', S.auditRun + '% accuracy on ' + auditSample().length + ' records'); say(ui.auditMsg); break;
    case 'copyAudit': {
      const csv = ['n,date,actor,action,npi,provider,reason,detail'].concat(S.audit.map(x => [x.n, x.date, x.actor, x.action, x.id, x.name, x.reason, x.detail].map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))).join('\n');
      const done = ok => { ui.auditMsg = ok ? 'Audit log copied as CSV (' + S.audit.length + ' rows).' : 'Copy was blocked in this view. Select the table text and copy it manually.'; render(); say(ui.auditMsg); };
      try { navigator.clipboard.writeText(csv).then(() => done(true), () => done(false)); } catch (er) { done(false); }
      return;
    }
  }
  if (ui.tab === 'queue' && S.loaded && ['approve', 'remove'].includes(act) && ui.open && rec(ui.open) && !open(rec(ui.open)) && !(ui.drawerMsg && ui.drawerMsg.t === 'err')) { const l = S.recs.filter(r => open(r) && (ui.lane === 'all' || analyse(r).lane === ui.lane) && matchQ(r)); const n = l[0]; if (n) { const m = ui.drawerMsg; ui.open = n.id; ui.reason = ''; ui.rmTick = false; ui.drawerMsg = m; } }
  render();
  if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel) { const r = rec(ui.open); ui.sel[r.id] = Object.assign({}, ui.sel[r.id], { [t.dataset.sel]: t.value }); }
  else if (t.dataset.owner) { const r = rec(t.dataset.owner); r.owner = t.value; log('Owner changed', r, '', t.value); say('Owner set to ' + t.value); }
  else if (t.id === 'reason') ui.reason = t.value;
  else if (t.id === 'rmTick') ui.rmTick = t.checked;
  else if (t.id === 'qaTick') ui.qaTick = t.checked;
  else if (t.id === 'cWrong' || t.id === 'cRev') { if (t.id === 'cWrong') CONFIG.costs.wrongPublish = Math.max(0, Number(t.value) || 0); else CONFIG.costs.review = Math.max(0, Number(t.value) || 0); ui.costOpen = true; clearTimeout(ui.rt); ui.rt = setTimeout(render, 220); }
  else if (t.id === 'thAuto' || t.id === 'thLow' || t.id === 'thCad') {
    const th = CONFIG.thresholds, v = Number(t.value);
    if (t.id === 'thAuto') th.auto = Math.max(50, Math.min(100, v)); if (t.id === 'thLow') th.low = Math.max(0, Math.min(th.auto - 1, v)); if (t.id === 'thCad') th.cadenceDays = Math.max(30, Math.min(365, v));
    log('Rule changed', null, 'R5 Analyst override of lane', 'auto ' + th.auto + ', low ' + th.low + ', cadence ' + th.cadenceDays); ui.rulesOpen = true; clearTimeout(ui.rt); ui.rt = setTimeout(() => { render(); say('Lanes recomputed with the new rules.'); }, 220);
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.tax) ui.tax[e.target.dataset.tax] = e.target.value;
  else if (e.target.id === 'q') { ui.filterQ = e.target.value; if (S.loaded && ui.tab !== 'queue' && ui.tab !== 'exceptions' && ui.tab !== 'downstream') ui.tab = 'queue'; render(); }
});
document.addEventListener('keydown', e => {
  if (ui.tab === 'queue' && S.loaded && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    const k = e.key.toLowerCase(), sel = { a: '[data-act="approve"]', o: '[data-act="outreach"]', e: '[data-act="escalate"]' }[k];
    if (k === 'j' || k === 'k') { const rows = [...document.querySelectorAll('.irow')]; const i = rows.findIndex(x => x.classList.contains('sel')); const t = rows[Math.max(0, Math.min(rows.length - 1, i + (k === 'j' ? 1 : -1)))]; if (t) t.click(); e.preventDefault(); return; }
    if (sel) { const b = document.querySelector('.ws ' + sel); if (b && !b.disabled) { b.click(); e.preventDefault(); } return; }
  }
  if (e.key === 'Escape' && ui.open && !(ui.tab === 'queue' && S.loaded)) { const id = ui.open; ui.open = null; ui.drawerMsg = null; render(); const b = document.querySelector('[data-act="openRec"][data-id="' + id + '"]'); if (b) b.focus(); } });
render();
</script>
